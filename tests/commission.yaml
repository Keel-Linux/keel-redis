# The commissioning contract of keel-redis (handbook decision 0075).
# bin/keel-commission of Keel-Linux/.github reads it. It makes a container
# from the template (or a VM from the ISO) as an operator does, answers the
# first boot (or preseeds it with the instance below), and then checks what
# this file says. The CI job "commission / contract" checks only that this
# file is valid.
#
# The manifest allows one mode, simple (modes: [simple], decision 0076), so
# this contract has no cloud part and no nodes. The passes are
# lxc-interactive, lxc-preseed and vm-iso.
#
# A new first boot question or a new secret is a change of this file in the
# same pull request (0075, Consequences).
contract: 1
appliance: redis
secrets: [root, db]
# The prompts are the titles that the first boot draws on tty1. A password
# comes first as a menu of the same title (Generate or Manual), and the
# runner takes Manual.
#
# No question for the Mode screen. The appliance allows one mode, so the
# first boot records simple and draws no screen (keelmode.unattended of
# confconsole). keel-init then shows the mode in a box with the title
# "Installation mode", and the runner gives that box Enter, as it does for
# each screen that is not a question here. A mode question would fail the
# vm-iso pass, where no Mode screen comes.
questions:
  - id: root_password
    hook: 30rootpass
    prompt: Root Password
    answer: secret:root
  # firstboot.d/35redispass of unit-redis (bin/redispass.py): the password
  # of the ACL user admin
  - id: db_password
    hook: 35redispass
    prompt: Redis password
    answer: secret:db
  - id: alert_email
    hook: 85secalerts
    prompt: System Notifications
    answer: admin@example.org
# keel/instance.example.yaml of this repository in the shape of Core's
# contract: the appliance, the mode and the five overlays of Core, the
# secrets of the run, and no instance name (the machine keeps the name that
# pct create gave it). No app.options: the manifest declares no option, and
# keel refuses an option that no manifest of the chain declares when the
# description names the appliance (keel-postgresql, BR1 and BR2,
# 2026-11-06). The ACL user is then admin, the default of unit-redis.
instance:
  version: 1
  network:
    managed_by: host
    interfaces:
      eth0:
        ipv6:
          method: auto
  tls:
    acme:
      enabled: false
  appliance:
    name: redis
  installation:
    mode: simple
  overlays:
    installer: enabled
    wireguard: disabled
    etcd: disabled
    crowdsec: disabled
    vip: disabled
  secrets:
    root_password: secret:root
    db_password: secret:db
  hub:
    api_key: skip
  security:
    alerts: admin@example.org
    updates_at_first_boot: skip
  first_login_wizard: false
# Each proof runs as root in the machine, with the value of its secret in
# $SECRET.
proofs:
  - {secret: root, kind: shadow, user: root}
  # The record names a proof by its secret and its kind, in the order of
  # this list: the Nth "proof.root.command" line is the Nth command proof of
  # root below, and the same for db.
  #
  # root 1: postfix may send off the machine (Core's proof: the core layer
  # of 2026-11-06 had "inet_protocols = " and the alert mail stayed
  # deferred).
  - secret: root
    kind: command
    run: 'test "$(postconf -h inet_protocols)" = all && ! postqueue -p | grep -q "network protocols are disabled"'
  # root 2: the first boot recorded the one mode the manifest allows; keel
  # resolves the chain of the manifests; each unit that core.yaml and
  # redis.yaml name is a unit of the machine; and no unit failed.
  - secret: root
    kind: command
    run: 'python3 -c "import yaml; d = yaml.safe_load(open(\"/etc/keel/instance.yaml\")); assert d[\"installation\"][\"mode\"] == \"simple\"" && keel manifest validate >/dev/null 2>&1 && for u in $(sed -n "s/^ *unit: *\([A-Za-z0-9@._-]*\).*/\1/p" /usr/share/keel/appliances/core.yaml /usr/share/keel/appliances/redis.yaml); do systemctl cat "$u" >/dev/null 2>&1 || exit 1; done && test "$(systemctl --failed --no-legend --plain | wc -l)" = 0'
  # root 3: Redis listens on port 6379 of the manifest, on the two loopback
  # addresses of 10-keel-bind.conf of unit-redis, and on no other address:
  # in the simple mode, 6379 is not on the network.
  - secret: root
    kind: command
    run: 'test "$(ss -Hltn "sport = :6379" | awk "{print \$4}" | LC_ALL=C sort | tr "\n" " ")" = "127.0.0.1:6379 [::1]:6379 "'
  # root 4: the check of redis.yaml works. keel prints the check that the
  # manifests of the image resolve to (keel manifest show --resolved
  # redis): it is a command (redis-cli INFO on [::1]:6379, 19.0-13), the
  # command exits 0, and the check is not Monit's redis protocol test,
  # which sends PING that the default account may not run. The proof does
  # not ask Monit: a single node has a monitor only when its spec turns one
  # on with a channel (decision 0021), and the passes declare none.
  - secret: root
    kind: command
    run: 't=$(keel manifest show --resolved redis) || exit 1; ! echo "$t" | grep -qE "^[|] redis [|] .* [|] redis (loopback|mesh) port 6379 [|]" || exit 1; ! grep -qE "protocol: *redis" /usr/share/keel/appliances/redis.yaml || exit 1; c=$(echo "$t" | sed -n "s/^[|] redis [|] redis [|] redis [|] command \(\/[^|]*[^ |]\) [|] .*/\1/p"); test -n "$c" || exit 1; $c >/dev/null 2>&1'
  # Each Redis proof reads the answer of redis-cli, never its exit code.
  #
  # db 1: the ACL user admin answers PONG with the db secret on ::1 and on
  # 127.0.0.1 (the bind of unit-redis), port 6379; with no secret, a key is
  # refused (NOPERM) on both addresses, as the default account may run INFO
  # only (20-keel-acl.conf of unit-redis); a wrong password is refused
  # (WRONGPASS).
  - secret: db
    kind: command
    run: 'c="redis-cli --no-auth-warning -p 6379"; for h in ::1 127.0.0.1; do test "$(REDISCLI_AUTH="$SECRET" $c -h $h --user admin PING 2>&1)" = PONG || exit 1; $c -h $h GET kc:probe 2>&1 | grep -q "^NOPERM" || exit 1; done; REDISCLI_AUTH="x$SECRET" $c -h ::1 --user admin PING 2>&1 | grep -q WRONGPASS'
  # db 2: persistence is on: Debian's redis.conf has no save line, so Redis
  # keeps its save points (3600 1 300 100 60 10000) and saves at a stop. A
  # key written before a restart of redis-server is there after it. The
  # proof then deletes the key.
  - secret: db
    kind: command
    run: 'c="redis-cli --no-auth-warning -p 6379 -h ::1 --user admin"; test -n "$(REDISCLI_AUTH="$SECRET" $c CONFIG GET save 2>&1 | sed -n 2p)" || exit 1; test "$(REDISCLI_AUTH="$SECRET" $c SET kc:probe kc-persist 2>&1)" = OK || exit 1; systemctl restart redis-server || exit 1; for i in $(seq 30); do redis-cli -h ::1 -p 6379 INFO server 2>/dev/null | grep -q "^redis_version:" && break; sleep 1; done; test "$(REDISCLI_AUTH="$SECRET" $c GET kc:probe 2>&1)" = kc-persist || exit 1; test "$(REDISCLI_AUTH="$SECRET" $c DEL kc:probe 2>&1)" = 1'
# The process of redis.yaml, the processes of Core's manifest, and Monit,
# which runs the checks that keel derives from the manifests
services: [redis-server, ssh, webmin, postfix, cron, monit]
# Webmin of Core is the one administration interface of the image. Debian 13
# has no Webmin module for Redis, and Redis Commander is not in this layer
# (README.rst, "What it deliberately leaves out").
urls:
  - {url: 'https://127.0.0.1:12321/', status: 200}
forbidden:
  # the build tools of a layer stay on the build host (conf.d/main)
  - {kind: path, name: /usr/local/lib/keel-build}
  # a database layer serves no web page of its own
  - {kind: path, name: /etc/nginx}
  # the hooks of the upstream appliance that this layer took out (changelog
  # 19.0-2): a world readable requirepass, and the bind questions
  - {kind: hook, name: 20regen-redis-secrets}
  - {kind: hook, name: 40redis}
# The web pages of the gallery (decisions 0075 and 0077): Webmin before and
# after the login with the root secret.
screenshots:
  - name: webmin
    port: 12321
    url: /
    login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
    # the dashboard of Webmin draws after the login; 8 s took a half drawn
    # page on a busy VM of BR2 (keel-postgresql, vm-iso, 2026-11-06)
    wait: 20
    text: System hostname
